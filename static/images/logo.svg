<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing outer circle -->
  <circle cx="24" cy="24" r="21" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="4 2" opacity="0.6" />
  
  <!-- Neural node core -->
  <rect x="10" y="10" width="28" height="28" rx="8" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.4" />
  <rect x="10" y="10" width="28" height="28" rx="8" stroke="url(#primaryGrad)" stroke-width="2" fill="#0f172a" fill-opacity="0.8" />

  <!-- Central Context Nodes -->
  <circle cx="24" cy="20" r="3.5" fill="url(#primaryGrad)" />
  <circle cx="17" cy="29" r="2.8" fill="#38bdf8" />
  <circle cx="31" cy="29" r="2.8" fill="#c084fc" />

  <!-- Synapse Connections -->
  <line x1="24" y1="20" x2="17" y2="29" stroke="url(#primaryGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="24" y1="20" x2="31" y2="29" stroke="url(#primaryGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="17" y1="29" x2="31" y2="29" stroke="url(#primaryGrad)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 2" />

  <!-- Orbiting pulse ring -->
  <circle cx="24" cy="20" r="6" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
</svg>
